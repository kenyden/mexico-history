<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>奇琴伊察｜庫庫爾坎光影蛇形・第一階段</title>
<style>
:root{--bg:#050608;--panel:#11151b;--line:#2b333c;--text:#e9e5d8;--muted:#9da3a9;--gold:#d9ae57;--jade:#71c8a1;--red:#db7562}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}#app{height:100%;position:relative}#stage{position:absolute;inset:0}canvas{display:block}#hud{position:absolute;left:18px;top:16px;max-width:390px;pointer-events:none;text-shadow:0 2px 5px #000}.eyebrow{color:var(--gold);letter-spacing:2px;font-size:12px}.title{font-size:22px;font-weight:650;margin:5px 0}.sub{color:var(--muted);line-height:1.6}.readout{margin-top:12px;color:#f0d9a0;font-variant-numeric:tabular-nums}.status{color:var(--jade);margin-top:4px}.warn{color:var(--red)}#controls{position:absolute;left:16px;right:16px;bottom:16px;background:rgba(13,16,21,.94);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(12px)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row+ .row{margin-top:9px}label{color:var(--muted)}button,input{font:inherit;color:var(--text);background:#1b222b;border:1px solid #39434d;border-radius:7px;padding:7px 10px}button{cursor:pointer}button:hover,button.on{border-color:var(--gold);color:#ffe1a1}input[type=date]{color-scheme:dark}input[type=range]{flex:1;min-width:220px}.small{font-size:12px;color:var(--muted)}#legend{position:absolute;right:18px;top:18px;background:rgba(13,16,21,.8);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--muted);line-height:1.8;pointer-events:none}.sw{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px}.sun{background:#f1c661}.analysis{background:#59d6a2}.shadow{background:#9c8b68}@media(max-width:650px){.title{font-size:18px}#legend{display:none}#controls{font-size:13px}.row{gap:6px}button,input{padding:6px 7px}}
</style>
</head>
<body><div id="app"><div id="stage"></div>
<div id="hud"><div class="eyebrow">CHICHÉN ITZÁ · EL CASTILLO</div><div class="title">庫庫爾坎光影蛇形</div><div class="sub">第一階段：展示級幾何模型＋真實太陽位置＋實際陰影投影</div><div id="dateReadout" class="readout"></div><div id="sunReadout" class="status"></div><div id="phenom" class="status"></div></div>
<div id="legend"><div><span class="sw sun"></span>太陽方向</div><div><span class="sw shadow"></span>真實幾何陰影</div><div><span class="sw analysis"></span>蛇形分析輔助</div></div>
<div id="controls"><div class="row"><label>日期 <input id="date" type="date" min="2026-01-01" max="2030-12-31" value="2026-03-20"></label><label>時間 <input id="time" type="range" min="5" max="19" step="0.0167" value="16.7"></label><output id="timeOut">16:42</output><button id="play">▶ 播放</button><button id="reset">⟲ 春分</button></div><div class="row"><button data-speed="1">1×</button><button data-speed="4">4×</button><button data-speed="16" class="on">16×</button><button data-speed="64">64×</button><button id="analysis">蛇形分析：關</button><span class="small">滑動時間看太陽角度與真實影子；「蛇形分析」是可開關的輔助標示，非假造陰影。</span></div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id); const stage=$('stage');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050608);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,500); camera.position.set(42,32,48); camera.lookAt(0,8,0);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; stage.appendChild(renderer.domElement);
let down=false,lastX=0,lastY=0,dist=58,az=3.85,el=.42;
renderer.domElement.addEventListener('pointerdown',e=>{down=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointerup',()=>down=false);renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;az-=(e.clientX-lastX)*.008;el=Math.max(.12,Math.min(1.35,el+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY;updateCamera()});renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(28,Math.min(130,dist+e.deltaY*.04));updateCamera()},{passive:true});
function updateCamera(){camera.position.set(Math.cos(az)*Math.cos(el)*dist,Math.sin(el)*dist,Math.sin(az)*Math.cos(el)*dist);camera.lookAt(0,8,0)}
const ambient=new THREE.HemisphereLight(0x6b6a60,0x08090b,.38);scene.add(ambient);const sunLight=new THREE.DirectionalLight(0xffdca0,2.2);sunLight.castShadow=true;sunLight.shadow.mapSize.set(2048,2048);sunLight.shadow.camera.left=-60;sunLight.shadow.camera.right=60;sunLight.shadow.camera.top=60;sunLight.shadow.camera.bottom=-60;sunLight.shadow.bias=-.0004;scene.add(sunLight);sunLight.target.position.set(0,0,0);scene.add(sunLight.target);
const stone=new THREE.MeshStandardMaterial({color:0x8b806d,roughness:.92,metalness:0});const stoneDark=new THREE.MeshStandardMaterial({color:0x5b5145,roughness:1});const groundMat=new THREE.MeshStandardMaterial({color:0x171914,roughness:1});
const pyramid=new THREE.Group();scene.add(pyramid);const base=55.3,height=24,levels=9;
pyramid.rotation.y=0.30; // 北階梯朝東北偏，讓夕陽掃進階梯（真實 El Castillo 階梯軸非純正北）
for(let i=0;i<levels;i++){const w=base*(1-i/levels)*.96;const y=i*(height/levels);const h=height/levels;const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),stone);m.position.y=y+h/2;m.castShadow=true;m.receiveShadow=true;pyramid.add(m)}
// staircases: steps embedded so that each step's face/riser catches side low sun -> serpiente zigzag
// 兩側緊貼塔身階梯狀稜角（金字塔本體稜線延伸，非獨立欄杆）
function staircase(rot){const g=new THREE.Group();const nsp=40;const topW=6.2;
  for(let i=0;i<nsp;i++){const t=i/nsp;const y=height*t+0.15;const z=base/2-((base/2-2.4)*t);const step=new THREE.Mesh(new THREE.BoxGeometry(topW,(height/nsp)*1.55,(base/2-2.4)/nsp),stoneDark);step.position.set(0,y,z);step.castShadow=true;step.receiveShadow=true;g.add(step)}
  [-1,1].forEach(sd=>{for(let i=0;i<levels;i++){const yy=i*(height/levels)+(height/levels)/2;const zz=base/2-((base/2-2.4)*(i/levels));const bx=new THREE.Mesh(new THREE.BoxGeometry(topW,height/levels,1.05),stone);bx.position.set(sd*(topW/2+1.0),yy,zz+0.1);bx.castShadow=true;bx.receiveShadow=true;g.add(bx)}});
  g.rotation.y=rot;return g}
[0,Math.PI/2,Math.PI,Math.PI*1.5].forEach(a=>pyramid.add(staircase(a)));
// 原始形制不加入兩條獨立欄杆；北階梯先以階梯本體呈現，光影來源後續依實測構造重建。
// temple top
const temple=new THREE.Mesh(new THREE.BoxGeometry(10,4.8,10),stone);temple.position.y=height+2.4;temple.castShadow=true;temple.receiveShadow=true;pyramid.add(temple);const door=new THREE.Mesh(new THREE.BoxGeometry(3.2,3.2,.35),stoneDark);door.position.set(0,height+2.2,5.05);pyramid.add(door);
// stylized serpent head, low detail for phase 1
const head=new THREE.Group();const hmat=new THREE.MeshStandardMaterial({color:0x9b8756,roughness:.9});const sn=new THREE.Mesh(new THREE.ConeGeometry(2.0,3.3,6),hmat);sn.rotation.x=-Math.PI/2;sn.position.set(0,1.1,base/2+1.2);sn.castShadow=true;head.add(sn);const eyeMat=new THREE.MeshBasicMaterial({color:0xc8a557});[-.65,.65].forEach(x=>{const eye=new THREE.Mesh(new THREE.SphereGeometry(.14,8,8),eyeMat);eye.position.set(x,1.7,base/2+2.5);head.add(eye)});pyramid.add(head);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// 分析層：可動三角形的容器，位置隨太陽方位/高度在 setSun 每幀重排
const analysisGroup=new THREE.Group();scene.add(analysisGroup);const analysisMat=new THREE.MeshBasicMaterial({color:0x59d6a2,transparent:true,opacity:.32,side:THREE.DoubleSide,depthWrite:false});
const tris=[];
for(let i=0;i<8;i++){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-1.9,0,0, 1.9,0,0, 0,1.5,1.6]),3));g.computeVertexNormals();const m=new THREE.Mesh(g,analysisMat);m.visible=false;analysisGroup.add(m);tris.push(m)}
const ANCHOR=Date.UTC(2026,0,1);let state={playing:false,speed:16,analysis:false,ms:Date.UTC(2026,2,20,22,50)};
function dayOfYear(d){const start=new Date(Date.UTC(d.getUTCFullYear(),0,0));return (d-start)/86400000}
function solar(date){const N=dayOfYear(date),B=2*Math.PI*(N-81)/364, eot=9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);const decl=23.44*Math.sin(2*Math.PI*(284+N)/365);const localMinutes=date.getUTCHours()*60+date.getUTCMinutes()+date.getUTCSeconds()/60-5*60;const solarMin=localMinutes+eot+4*(-88.5678)-60*(-5);const ha=(solarMin/4-180)*Math.PI/180, lat=20.6843*Math.PI/180, dec=decl*Math.PI/180;const alt=Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(ha));const az=Math.atan2(Math.sin(ha),Math.cos(ha)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat))*180/Math.PI+180;return {alt,az:(az+360)%360,decl,eot}}
function setSun(){const d=new Date(state.ms),s=solar(d);const a=s.alt,z=s.az*Math.PI/180;const far=90;const pos=new THREE.Vector3(Math.cos(a)*Math.sin(z)*far,Math.max(2,Math.sin(a)*far),Math.cos(a)*Math.cos(z)*far);sunLight.position.copy(pos);sunLight.intensity=a>0?5.0:0.18;const deg=s.az.toFixed(1);$('sunReadout').textContent=`太陽方位 ${deg}° · 高度 ${(s.alt*180/Math.PI).toFixed(1)}° · 赤緯 ${(s.decl).toFixed(2)}°`;const nearEquinox=Math.abs(s.decl)<2.4&&s.alt>0&&s.az>235&&s.az<290;const side=s.az>=180&&s.az<270?-1:(s.az>=270&&s.az<360?1:0);const altDeg=s.alt*180/Math.PI;const ready=Math.abs(s.decl)<2.4&&altDeg>3&&side!==0;analysisGroup.visible=state.analysis&&ready;if(ready){const topZ=2.8,botZ=base/2-1.0,topY=height-1.6,botY=.5;const fill=Math.max(.3,Math.min(1,(18-altDeg)/9));const cnt=Math.round(3+fill*5);tris.forEach((m,i)=>{const show=i<cnt;m.visible=show;if(!show)return;const t=cnt===1?0:i/(cnt-1);m.position.set(side*3.15,topY+(botY-topY)*t*fill,topZ+(botZ-topZ)*t*fill);m.rotation.y=side<0?.5:-.5;m.rotation.z=side*.14})}$('phenom').textContent=nearEquinox?'北階梯：接近羽蛇光影條件（分析層已標示）':s.alt<=0?'太陽在地平線下：不產生可見日照':'北階梯：季節／方位不在最佳羽蛇條件';$('phenom').className=nearEquinox?'status':'status warn';$('dateReadout').textContent=new Intl.DateTimeFormat('zh-TW',{dateStyle:'full',timeZone:'America/Cancun'}).format(d)+` · 當地時間 ${d.toLocaleTimeString('zh-TW',{timeZone:'America/Cancun',hour:'2-digit',minute:'2-digit',hour12:false})}`}
function validMs(ms){return Number.isFinite(ms)&&Number.isFinite(new Date(ms).getTime())}
function setUI(){if(!validMs(state.ms))state.ms=Date.UTC(2026,2,20,21,42);const d=new Date(state.ms);$('date').value=d.toISOString().slice(0,10);let localHour=d.getUTCHours()-5+d.getUTCMinutes()/60;if(!Number.isFinite(localHour))localHour=16.7;localHour=Math.max(5,Math.min(19,localHour));$('time').value=localHour;const h=Math.floor(localHour),m=Math.round((localHour-h)*60);$('timeOut').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');setSun()}
$('date').addEventListener('change',e=>{const parts=String(e.target.value||'').split('-').map(Number);const t0=Number($('time').value);const t=Number.isFinite(t0)?Math.max(5,Math.min(19,t0)):16.7;if(parts.length!==3||parts.some(v=>!Number.isFinite(v))){setUI();return}state.ms=Date.UTC(parts[0],parts[1]-1,parts[2],Math.floor(t)+5,Math.round((t%1)*60));state.playing=false;$('play').textContent='▶ 播放';setUI()});$('time').addEventListener('input',e=>{if(!validMs(state.ms))state.ms=Date.UTC(2026,2,20,21,42);const d=new Date(state.ms),[y,m,day]=[d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()];const t0=Number(e.target.value),t=Number.isFinite(t0)?t0:16.7;state.ms=Date.UTC(y,m,day,Math.floor(t)+5,Math.round((t%1)*60));setUI()});$('play').onclick=()=>{state.playing=!state.playing;$('play').textContent=state.playing?'⏸ 暫停':'▶ 播放'};$('reset').onclick=()=>{state.ms=Date.UTC(2026,2,20,21,42);state.playing=false;$('play').textContent='▶ 播放';setUI()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{state.speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('on',x===b))});$('analysis').onclick=()=>{state.analysis=!state.analysis;$('analysis').textContent='蛇形分析：'+(state.analysis?'開':'關');$('analysis').classList.toggle('on',state.analysis);setSun()};
let last=performance.now();function animate(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(state.playing){state.ms+=dt*state.speed*86400000/20;const d=new Date(state.ms);if(d.getUTCFullYear()>2030)state.ms=Date.UTC(2026,0,1);setUI()}renderer.render(scene,camera);requestAnimationFrame(animate)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setUI();updateCamera();window.__mayanSnake={scene,solar,state,analysisGroup,sunLight,version:'phase-1'};requestAnimationFrame(animate);
</script></body></html>
